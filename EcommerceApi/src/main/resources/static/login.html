<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Ecommerce API</title>
</head>
<body>
<h2>Login</h2>
<form id="loginForm">
    <input type="text" id="username" name="username" placeholder="Username" required><br><br>
    <input type="password" id="password" name="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
</form>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Step 1: Login request
        // Note: In a real app, you'd fetch the CSRF token first,
        // but Spring Security's default form login handles this via cookies.

        const response = await fetch('/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                'username': username,
                'password': password
            })
        });

        if (response.ok) {
            alert('Login Successful!');
            window.location.href = '/dashboard.html'; // redirect after success
        } else {
            alert('Login Failed! Check your credentials.');
        }
    });
</script>
</body>
</html>
