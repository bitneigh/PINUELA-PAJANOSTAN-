<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (function checkAuthentication() {
            // Kunin ang active stateless encryption token string mula sa browser memory
            const token = localStorage.getItem('jwt_token');
            if (!token) {
                // Humarang kaagad kapag walang string value na nakuha sa local storage container
                alert("Protected Route: Please sign in first.");
                window.location.href = "/login.html";
                return;
            }

            // Isama ang token bitbit ang custom Authorization Bearer network tracking header metadata format
            fetch('/api/v1/users/me', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
                .then(response => {
                    if (response.status === 401) {
                        alert("Session expired: Please sign in again.");
                        localStorage.removeItem('jwt_token');
                        window.location.href = "/login.html";
                    } else if (response.status === 403) {
                        // Itatapon sa products list o home page kapag regular user lang ang nagtangkang pumasok
                        alert("Access Denied: Admins only.");
                        window.location.href = "/products.html";
                    }
                })
                .catch(error => {
                    console.error("Token verification parsing failure exception:", error);
                    window.location.href = "/login.html";
                });
        })();
    </script>
    <link rel="stylesheet" href="style.css">
    <title>Admin Dashboard | TechStore</title>
</head>
<body>
<header style="background: #222; color: white; padding: 20px; text-align: center;">
    <strong>ADMINISTRATOR CONTROL PANEL</strong>
</header>

<main style="max-width: 1000px; margin: 40px auto; padding: 20px; font-family: sans-serif;">
    <div style="background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eaeaea;">
        <h2 style="color: #333; margin-top: 0;">Admin Dashboard</h2>
        <p style="color: #666; font-size: 0.9rem; margin-bottom: 25px;">Welcome to the secure admin area! This system component requires direct ROLE_ADMIN authorizations to evaluate parameters.</p>

        <form id="admin-product-form" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #444;">Product Name</label>
                <input type="text" id="prod-name" placeholder="e.g., MacBook Pro M3" required
                       style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>

            <div>
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #444;">Price (PHP)</label>
                <input type="number" id="prod-price" step="0.01" placeholder="e.g., 149999.00" required
                       style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; padding: 15px; background: #e63946; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;">
                Save Product Entry
            </button>
        </form>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
