<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - TechStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Tech<span>Store</span></h1>
    <nav>
        <ul>
            <li><a href="/landing.html">Shop</a></li>
            <li><a href="/checkout.html">Checkout</a></li>
            <li><a href="/account.html">Account</a></li>
            <li><span class="logout-link" onclick="handleLogout()">Logout</span></li>
        </ul>
    </nav>
</header>

<main class="checkout-wrapper">
    <div class="glass-card">
        <h2>Shipping Details</h2>
        <form id="checkout-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required placeholder="Juan Dela Cruz">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="juan@example.com">
            </div>
            <div class="form-group">
                <label for="address">Complete Shipping Address</label>
                <textarea id="address" rows="4" required placeholder="House No., Street Name, Barangay, City, Province"></textarea>
            </div>
            <button type="submit" class="btn-action">Place Order</button>
        </form>
    </div>

    <div class="glass-card" style="height: max-content;">
        <h2>Order Summary</h2>
        <div id="cart-items-container"></div>
        <div class="cart-total-price" id="cart-total" style="margin-top: 1.5rem; font-size: 1.4rem;">Total: ₱0</div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
