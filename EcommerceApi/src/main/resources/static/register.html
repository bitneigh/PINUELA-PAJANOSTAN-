<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TechStore</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: radial-gradient(circle at 10% 20%, rgb(90, 92, 106) 0%, rgb(32, 34, 47) 90%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h2 { color: #fff; margin-bottom: 0.5rem; font-weight: 600; font-size: 1.8rem; }
        p.subtitle { color: #a0a5b5; margin-bottom: 2rem; font-size: 0.9rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; color: #e2e8f0; font-size: 0.85rem; margin-bottom: 0.5rem; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        select option { background: #20222f; color: #fff; }
        input:focus, select:focus { outline: none; border-color: #10b981; background: rgba(255, 255, 255, 0.12); }
        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 0.5rem;
        }
        .btn-submit:hover { background: #059669; }
        .switch-prompt { text-align: center; margin-top: 1.5rem; color: #a0a5b5; font-size: 0.85rem; }
        .switch-prompt a { color: #34d399; text-decoration: none; font-weight: 600; }
        .switch-prompt a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Get Started</h2>
    <p class="subtitle">Create an account to explore our premium inventory catalog.</p>

    <form id="register-form">
        <div class="form-group">
            <label for="reg-username">Username</label>
            <input type="text" id="reg-username" required placeholder="Pick a unique username">
        </div>
        <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" required placeholder="Choose a strong password">
        </div>
        <div class="form-group">
            <label for="reg-role">Account Privilege</label>
            <select id="reg-role" required>
                <option value="USER">Standard Customer (USER)</option>
                <option value="ADMIN">Store Management (ADMIN)</option>
            </select>
        </div>
        <button type="submit" class="btn-submit">Sign Up</button>
    </form>

    <p class="switch-prompt">
        Already have an account? <a href="/login.html">Sign In</a>
    </p>
</div>

<script src="script.js"></script>
</body>
</html>
