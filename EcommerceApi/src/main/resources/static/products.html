<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - TechStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Tech<span>Store</span></h1>
    <nav>
        <ul>
            <li><a href="/landing.html">Shop</a></li>
            <li><a href="/checkout.html">Checkout</a></li>
            <li><a href="/account.html">Account</a></li>
            <li><span class="logout-link" onclick="handleLogout()">Logout</span></li>
        </ul>
    </nav>
</header>

<main class="main-container">
    <div class="sidebar-panel">
        <div class="glass-card">
            <h2 id="user-greeting">Welcome back!</h2>
            <div class="filter-group">
                <label class="filter-item"><input type="checkbox"> Audio Devices</label>
                <label class="filter-item"><input type="checkbox"> Wearables</label>
                <label class="filter-item"><input type="checkbox"> Laptops</label>
            </div>
        </div>

        <div class="glass-card">
            <h3>Shopping Bag</h3>
            <div id="cart-items-container"></div>
            <div class="cart-total-price" id="cart-total">Total: ₱0</div>
            <button class="shimmer-btn" onclick="window.location.href='/checkout.html'">Go to Checkout</button>
        </div>
    </div>

    <div class="product-grid" id="product-grid-target">
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
