<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Premium Collection | TechStore</title>
</head>
<body>
    <header>
        <div class="logo"><strong>TECHSTORE</strong></div>
        <nav>
            <ul>
                <li><a href="landing.html">Home</a></li>
                <li><a href="products.html">Shop</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="account.html">Profile</a></li>
            </ul>
        </nav>
    </header>

    <div class="shop-container">
        <aside style="padding: 20px; background: #fff; border-radius: 20px; margin-bottom: 20px;">
            <h3>Filters</h3>
            <label><input type="checkbox"> Audio</label><br>
            <label><input type="checkbox"> Wearables</label>
        </aside>

        <main class="product-grid">
            <article>
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" alt="Headphones">
                <h4>Wireless Max</h4>
                <p style="color: var(--accent); font-weight: bold;">$299</p>
                <a href="detail.html"><button class="btn-shimmer">View Details</button></a>
            </article>

            <article>
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" alt="Watch">
                <h4>Smart Watch Ultra</h4>
                <p style="color: var(--accent); font-weight: bold;">$399</p>
                <a href="detail.html"><button class="btn-shimmer">View Details</button></a>
            </article>

         
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
