<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - TechStore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Tech<span>Store</span></h1>
    <nav>
        <ul>
            <li><a href="/landing.html">Shop</a></li>
            <li><a href="/checkout.html">Checkout</a></li>
            <li><a href="/account.html">Account</a></li>
            <li><span class="logout-link" onclick="handleLogout()">Logout</span></li>
        </ul>
    </nav>
</header>

<main class="profile-container">
    <div class="profile-header">
        <div class="avatar-circle">U</div>
        <div>
            <h2 id="profile-username" style="color: white; margin-bottom: 4px;">Loading Profile...</h2>
            <p style="color: #a0a5b5; font-size: 0.9rem;">Premium Account Member</p>
        </div>
    </div>

    <div class="glass-card">
        <h3 style="margin-bottom: 1.5rem;">Recent Order History</h3>

        <div class="order-card">
            <div>
                <h4 style="color: white; margin-bottom: 4px;">Order #TS-94820</h4>
                <p style="color: #a0a5b5; font-size: 0.85rem;">Placed on May 16, 2026</p>
            </div>
            <span class="status-badge">Delivered</span>
        </div>

        <div class="order-card">
            <div>
                <h4 style="color: white; margin-bottom: 4px;">Order #TS-94115</h4>
                <p style="color: #a0a5b5; font-size: 0.85rem;">Placed on May 10, 2026</p>
            </div>
            <span class="status-badge" style="background: rgba(0, 113, 227, 0.15); color: #0071e3;">In Transit</span>
        </div>
    </div>
</main>

<script src="script.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        try {
            const token = localStorage.getItem('jwt_token');
            if (token) {
                const payload = JSON.parse(atob(token.split('.')[1]));
                document.getElementById('profile-username').textContent = payload.sub;
                document.querySelector('.avatar-circle').textContent = payload.sub.charAt(0).toUpperCase();
            }
        } catch (e) {
            document.getElementById('profile-username').textContent = "User Profile";
        }
    });
</script>
</body>
</html>
